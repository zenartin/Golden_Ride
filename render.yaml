services:
  - type: web
    name: golden-ride-api
    env: python
    rootDir: driver-app/backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: golden-ride-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: psql
    name: golden-ride-db
    plan: free
