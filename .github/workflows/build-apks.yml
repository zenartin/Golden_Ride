name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (User App)
        run: |
          cd user-app
          npm install

      - name: Build User App APK
        run: |
          cd user-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload User App APK
        uses: actions/upload-artifact@v4
        with:
          name: UserApp-APK
          path: user-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Install dependencies (Driver App)
        run: |
          cd driver-app
          npm install

      - name: Build Driver App APK
        run: |
          cd driver-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverApp-APK
          path: driver-app/android/app/build/outputs/apk/debug/app-debug.apk
